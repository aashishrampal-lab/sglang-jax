        - name: SGLANG_JAX_SPEC_CACHE_LOC_FIT
          value: '1'
        - name: SGLANG_JAX_SPEC_PRECOMPILE_FIRST_RUNG_ONLY
          value: '1'
        - name: SGLANG_JAX_SPEC_CACHE_LOC_LADDER
          value: '110592'
        - name: SGLANG_JAX_SPEC_NON_RELAY_PRECOMPILE_MAX_BS
          value: '64'
        - name: SGL_COOP_SINGLE_REQ
          value: '0'
        - name: DSA_SHARDED_PREFIX_PAGES
          value: '0'
        - name: SGL_PD_SHARED_PREFIX_LEN
          value: '262144'
        - name: SGL_PD_MAX_PREFIX_SLOTS
          value: '16'
        - name: SGL_PD_PIN_PREFIX_SLOTS
          value: '1'
        - name: LIBTPU_INIT_ARGS
          value: --xla_tpu_dvfs_p_state=7 --xla_tpu_all_gather_collective_matmul_mode=none --xla_tpu_reduce_scatter_collective_matmul_mode=none
            --xla_jf_spmd_threshold_for_windowed_einsum_mib=100000
        - name: TPU_PROCESS_PORT
          value: '8471'
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
        - name: TPU_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
---
# 5. Closed-Loop Empirical ISL Benchmark Client Job (n = 1..64)
apiVersion: batch/v1
kind: Job
metadata:
  name: glm53-bench-pdb-s4-sessions
  namespace: ubench-regression-tests
  labels:
    app: glm53-bench-pdb-s4-sessions
    kueue.x-k8s.io/queue-name: default
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: glm53-bench-pdb-s4-sessions
        kueue.x-k8s.io/queue-name: default
    spec:
      priorityClassName: medium
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: cpu-np
        workload: cpu-user
      tolerations:
      - key: cloud.google.com/gke-nodepool
        operator: Equal
        value: cpu-np
        effect: NoSchedule
      volumes:
      - name: data
        configMap:
          name: glm52-requests-mocked
      containers:
      - name: client
        image: us-central1-docker.pkg.dev/tpu-prod-env-one-vm/ubench-runner/vllm-tpu:glm5_2_dsa
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
          limits:
            cpu: '16'
            memory: 64Gi
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          LB_URL="http://glm53-pdb-s4-lb-svc.ubench-regression-tests.svc.cluster.local:8000"
          PREFILL_URL="http://glm53-pdb-s4-prefill-svc.ubench-regression-tests.svc.cluster.local:30271"
          DECODE_URL="http://glm53-pdb-s4-decode-svc.ubench-regression-tests.svc.cluster.local:30271"

          until curl -sf --max-time 5 "${PREFILL_URL}/health" >/dev/null && \
                curl -sf --max-time 5 "${DECODE_URL}/health" >/dev/null && \
                curl -sf --max-time 5 "${LB_URL}/v1/models" >/dev/null; do
            echo "Waiting for GLM-5.3 PD 1P1D dp=1 (1P + 1D + MiniLB, commit 1cef18b)..."
            sleep 10
          done

          rm -rf /tmp/sglang-jax-src
          git clone --single-branch -b glm52-rec2-coop-radix-split \
            https://github.com/aashishrampal-lab/sglang-jax.git /tmp/sglang-jax-src
          git -C /tmp/sglang-jax-src checkout 1cef18b

          STATE_ENV='{"request_id": "set-env-5-or-n-trunks", "state_data": {"override": {"env": {"SGL_PD_MAX_PREFIX_SLOTS": "16", "SGL_PD_PIN_PREFIX_SLOTS": "1"}}}}'

          # Note: --trunks-above-n16 5 runs the eviction-free 5* trunk baseline at n=32,64;
          # pass --trunks-above-n16 0 to run N=32,64 unpinned trunks.
          python3 -u /tmp/sglang-jax-src/benchmark/glm53/bench_empirical_isl_sessions.py \
            --base-url "${LB_URL}" \
            --prefill-url "${PREFILL_URL}" \
            --decode-url "${DECODE_URL}" \
            --set-prefill-state-json "${STATE_ENV}" \
            --set-decode-state-json "${STATE_ENV}" \
            --dataset /data/requests_mocked.jsonl.xz \
            --dp-size 1 \
            --max-pinned-prefix-slots 16 \
            --trunks-above-n16 5 \
            --sessions "1,2,4,8,16,32,64" \
            --warmup-pass-s 10 \
            --duration-per-n 210 \
            --cache-hit-rate 0.80 \
            --max-tokens 0 \
            --no-ignore-eos \
            --flush-each-n \
            --warmup-concurrency 8 \
            --output-json /tmp/glm53_dp1_exact_temps_sessions.json

          echo "=== DUMPING FULL JSON SUMMARY (GLM-5.3 PD DP1 TP16 EXACT TEMPS) ==="
          cat /tmp/glm53_dp1_exact_temps_sessions.json
