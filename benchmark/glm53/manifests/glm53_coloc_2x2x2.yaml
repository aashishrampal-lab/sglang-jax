# ==============================================================================
# GLM-5.3 FP8 — Single-Slice Colocated 2x2x2 (dp=1, tp=16, ep=16)
# ==============================================================================
# Hardware : 1x TPU v7x 2x2x2 slice = 8 TPU7x chips (16 TensorCore devices)
# Cost     : $43.20/hr ($5.40/chip-hr 3-Year CUD in us-central1)
# Repo     : https://github.com/aashishrampal-lab/sglang-jax.git
# Branch   : glm52-rec2-coop-radix-split (commit 1cef18b)
# Deploy   : kubectl apply -f glm53_coloc_2x2x2.yaml
# ==============================================================================
# 1. Headless Service (TPU Multi-Host Worker Discovery)
apiVersion: v1
kind: Service
metadata:
  name: glm53-coloc-2x2x2
  namespace: ubench-regression-tests
  labels:
    app: glm53-coloc-2x2x2
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: glm53-coloc-2x2x2
  ports:
  - name: http
    port: 30271
    targetPort: 30271
  - name: dist-init
    port: 5000
    targetPort: 5000
  - name: tpu-process
    port: 8471
    targetPort: 8471
---
# 2. ClusterIP Service (Rank-0 HTTP Endpoint)
apiVersion: v1
kind: Service
metadata:
  name: glm53-coloc-2x2x2-svc
  namespace: ubench-regression-tests
spec:
  selector:
    app: glm53-coloc-2x2x2
    batch.kubernetes.io/job-completion-index: '0'
  ports:
  - name: http
    port: 30271
    targetPort: 30271
    protocol: TCP
---
# 3. Colocated TPU v7x 2x2x2 Server Job (dp=1, tp=16, ep=16)
apiVersion: batch/v1
kind: Job
metadata:
  name: glm53-coloc-2x2x2-slice-0
  namespace: ubench-regression-tests
  labels:
    app: glm53-coloc-2x2x2
    kueue.x-k8s.io/queue-name: multislice-queue
spec:
  backoffLimit: 0
  completionMode: Indexed
  completions: 2
  parallelism: 2
  template:
    metadata:
      annotations:
        cloud.google.com/gke-tpu-slice-topology: 2x2x2
        kueue.x-k8s.io/podset-unconstrained-topology: 'true'
      labels:
        app: glm53-coloc-2x2x2
        kueue.x-k8s.io/queue-name: multislice-queue
    spec:
      subdomain: glm53-coloc-2x2x2
      priorityClassName: medium
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu7x
        cloud.google.com/gke-tpu-topology: 2x2x2
        cloud.google.com/placement-policy-name: tpu7x-16-2x2x2-placement-policy
        cloud.google.com/reservation-name: cloudtpu-20260710003900-159478293
      tolerations:
      - key: google.com/tpu
        operator: Exists
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/reservation-name
        operator: Equal
        value: cloudtpu-20260710003900-159478293
        effect: NoSchedule
      volumes:
      - name: tmp-ram
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: model
        persistentVolumeClaim:
          claimName: glm53-model-rox
          readOnly: true
      containers:
      - name: sglang-jax
        image: us-central1-docker.pkg.dev/tpu-prod-env-one-vm/ubench-runner/vllm-tpu:glm5_2_dsa
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        - |
          for i in {0..1}; do
            until getent hosts glm53-coloc-2x2x2-slice-0-${i}.glm53-coloc-2x2x2 >/dev/null 2>&1; do
              sleep 2
            done
          done

          PHYS_ID=$(curl -sf -H "Metadata-Flavor: Google" \
            http://metadata.google.internal/computeMetadata/v1/instance/attributes/agent-worker-number \
            || echo "${JOB_COMPLETION_INDEX}")
          echo "[TPU-INIT] JOB_COMPLETION_INDEX=${JOB_COMPLETION_INDEX}, Physical GCE agent-worker-number=${PHYS_ID}"
          export TPU_WORKER_ID="${PHYS_ID}"

          if [ "${JOB_COMPLETION_INDEX}" != "${PHYS_ID}" ]; then
            export TPU_WORKER_HOSTNAMES="glm53-coloc-2x2x2-slice-0-1.glm53-coloc-2x2x2,glm53-coloc-2x2x2-slice-0-0.glm53-coloc-2x2x2"
            export TPU_PROCESS_ADDRESSES="glm53-coloc-2x2x2-slice-0-1.glm53-coloc-2x2x2:8471,glm53-coloc-2x2x2-slice-0-0.glm53-coloc-2x2x2:8471"
          else
            export TPU_WORKER_HOSTNAMES="glm53-coloc-2x2x2-slice-0-0.glm53-coloc-2x2x2,glm53-coloc-2x2x2-slice-0-1.glm53-coloc-2x2x2"
            export TPU_PROCESS_ADDRESSES="glm53-coloc-2x2x2-slice-0-0.glm53-coloc-2x2x2:8471,glm53-coloc-2x2x2-slice-0-1.glm53-coloc-2x2x2:8471"
          fi

          while true; do
            rm -rf /tmp/sglang-jax-src
            git clone --single-branch -b glm52-rec2-coop-radix-split \
              https://github.com/aashishrampal-lab/sglang-jax.git /tmp/sglang-jax-src
            git -C /tmp/sglang-jax-src checkout 1cef18b
            cp -r /tmp/sglang-jax-src/python/sgl_jax/* /opt/sglang-jax/python/sgl_jax/
            rm -rf /tmp/sglang-jax-src

            python3 -u -m sgl_jax.launch_server \
              --model-path /weights \
              --tokenizer-path /weights \
              --trust-remote-code \
              --dist-init-addr glm53-coloc-2x2x2-slice-0-0.glm53-coloc-2x2x2:5000 \
              --nnodes 2 \
              --node-rank ${JOB_COMPLETION_INDEX} \
              --tp-size 16 \
              --ep-size 16 \
              --dp-size 1 \
              --moe-backend fused_v2 \
              --tool-call-parser glm47 \
              --reasoning-parser glm45 \
              --device tpu \
              --random-seed 3 \
              --dtype bfloat16 \
              --kv-cache-dtype fp8_e4m3 \
              --max-running-requests 256 \
              --page-size 128 \
              --chunked-prefill-size 2048 \
              --max-prefill-tokens 32768 \
              --mem-fraction-static 0.83 \
              --context-length 110000 \
              --attention-backend dsa_sparse \
              --enable-cache-report \
              --enable-metrics \
              --log-level-http warning \
              --speculative-algorithm NEXTN \
              --speculative-draft-model-path /weights \
              --speculative-num-steps 4 \
              --speculative-eagle-topk 1 \
              --speculative-num-draft-tokens 5 \
              --precompile-bs-paddings 1 2 4 8 16 32 64 128 256 \
              --precompile-token-paddings 16 32 48 64 80 128 256 512 2048 \
              --host 0.0.0.0 \
              --port 30271 \
              2>&1 | tee /tmp/server_glm53_coloc_2x2x2.log
            sleep 10
          done
        ports:
        - name: http
          containerPort: 30271
          protocol: TCP
        - name: dist-init
          containerPort: 5000
          protocol: TCP
        - name: tpu-process
          containerPort: 8471
          protocol: TCP
        resources:
          requests:
            google.com/tpu: '4'
          limits:
            google.com/tpu: '4'
        volumeMounts:
        - name: model
          mountPath: /weights
          readOnly: true
        - name: tmp-ram
          mountPath: /tmp
        env:
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: HF_HOME
          value: /tmp/hf_cache
        - name: TPU_NAME
          value: glm53-coloc-2x2x2
        - name: JAX_COMPILATION_CACHE_DIR
          value: /tmp/jit_cache
        - name: SGL_MOE_FUSED_UNPERMUTE
          value: '1'
        - name: SGL_MOE_RAGGED_GATHER
          value: '1'
        - name: SGL_MOE_FUSED_MIN_TOKENS
          value: '4096'
        - name: SGL_MOE_EXPERT_SCATTER
          value: '1'
        - name: SGL_MOE_CHUNK_STAGE
          value: '4'
        - name: SGL_MLA_KV_PAD_MULTIPLE
          value: '4096'
        - name: SGL_MLA_MAX_PREFILL_KV_LEN
          value: '110592'
        - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
          value: '1'
        - name: DSA_INDEXER_KERNEL
          value: '1'
        - name: DSA_PREFILL_SPARSE
          value: '1'
        - name: DSA_INDEXER_KERNEL_PREFILL
          value: '1'
        - name: DSA_PREFILL_QBLOCK
          value: '1'
        - name: DSA_PREFILL_QBLOCK_QB
          value: '32'
        - name: DSA_SPEC_AS_DECODE
          value: '1'
        - name: DSA_SPEC_VERIFY_QGROUP
          value: '1'
        - name: DSA_IDX_VERIFY_BATCHED
          value: '0'
        - name: DSA_SPEC_VERIFY_LAST_Q_ONLY
          value: '1'
        - name: DSA_PAGE_TOPK
          value: '16'
        - name: SGLANG_JAX_MTP_KVSHARE
          value: '1'
        - name: SGLANG_JAX_MTP_INDEX_SHARE
          value: '1'
        - name: SGL_FUSED_KV_SCATTER
          value: '0'
        - name: SGL_DEBUG_STEP_TIMING
          value: '1'
        - name: SGLANG_JAX_DECODE_DISABLE_SC_GATHER_OFFLOAD
          value: '1'
        - name: SGLANG_JAX_SPEC_CACHE_LOC_FIT
          value: '1'
        - name: SGLANG_JAX_SPEC_PRECOMPILE_FIRST_RUNG_ONLY
          value: '1'
        - name: SGLANG_JAX_SPEC_CACHE_LOC_LADDER
          value: '110592'
        - name: SGLANG_JAX_SPEC_NON_RELAY_PRECOMPILE_MAX_BS
          value: '64'
        - name: SGL_COOP_SINGLE_REQ
          value: '0'
        - name: DSA_SHARDED_PREFIX_PAGES
          value: '0'
        - name: SGL_ENABLE_RADIX_CACHE
          value: '1'
        - name: SGL_MLA_COOP_PREFIX
          value: '1'
        - name: LIBTPU_INIT_ARGS
          value: --xla_tpu_dvfs_p_state=7 --xla_tpu_all_gather_collective_matmul_mode=none --xla_tpu_reduce_scatter_collective_matmul_mode=none
            --xla_jf_spmd_threshold_for_windowed_einsum_mib=100000
        - name: TPU_PROCESS_PORT
          value: '8471'
        - name: JOB_COMPLETION_INDEX
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
        - name: TPU_WORKER_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['batch.kubernetes.io/job-completion-index']
---
# 4. Closed-Loop Empirical ISL Benchmark Client Job (n = 1..64)
apiVersion: batch/v1
kind: Job
metadata:
  name: glm53-bench-coloc-2x2x2-sessions
  namespace: ubench-regression-tests
  labels:
    app: glm53-bench-coloc-2x2x2-sessions
    kueue.x-k8s.io/queue-name: default
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: glm53-bench-coloc-2x2x2-sessions
        kueue.x-k8s.io/queue-name: default
    spec:
      priorityClassName: medium
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-nodepool: cpu-np
        workload: cpu-user
      tolerations:
      - key: cloud.google.com/gke-nodepool
        operator: Equal
        value: cpu-np
        effect: NoSchedule
      volumes:
      - name: data
        configMap:
          name: glm52-requests-mocked
      containers:
      - name: client
        image: us-central1-docker.pkg.dev/tpu-prod-env-one-vm/ubench-runner/vllm-tpu:glm5_2_dsa
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: '4'
            memory: 16Gi
          limits:
            cpu: '16'
            memory: 64Gi
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          BASE_URL="http://glm53-coloc-2x2x2-svc.ubench-regression-tests.svc.cluster.local:30271"
          until curl -sf --max-time 5 "${BASE_URL}/health" >/dev/null; do
            echo "Waiting for GLM-5.3 Colocated 2x2x2 server (commit 1cef18b)..."
            sleep 10
          done

          rm -rf /tmp/sglang-jax-src
          git clone --single-branch -b glm52-rec2-coop-radix-split \
            https://github.com/aashishrampal-lab/sglang-jax.git /tmp/sglang-jax-src
          git -C /tmp/sglang-jax-src checkout 1cef18b

          python3 -u /tmp/sglang-jax-src/benchmark/glm53/bench_empirical_isl_sessions.py \
            --base-url "${BASE_URL}" \
            --prefill-url "${BASE_URL}" \
            --decode-url "" \
            --dataset /data/requests_mocked.jsonl.xz \
            --dp-size 1 \
            --max-pinned-prefix-slots 16 \
            --trunks-above-n16 5 \
            --sessions "1,2,4,8,16,32,64" \
            --warmup-pass-s 10 \
            --duration-per-n 210 \
            --cache-hit-rate 0.80 \
            --max-tokens 0 \
            --no-ignore-eos \
            --flush-each-n \
            --warmup-concurrency 8 \
            --output-json /tmp/glm53_coloc_2x2x2_exact_temps_sessions.json

          echo "=== DUMPING FULL JSON SUMMARY (GLM-5.3 COLOCATED 2x2x2 EXACT TEMPS) ==="
          cat /tmp/glm53_coloc_2x2x2_exact_temps_sessions.json
